name: Publicar Painel Financeiro e Orçamentário IOC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar base de repasses a partir do Google Drive
        run: |
          curl -fLsS "https://drive.google.com/uc?export=download&id=1ghcBkPmT-IkfWozLZVDdMvMe7eoD2J6k" -o /tmp/repasses.csv
          python - <<'PY'
          import csv, json
          from collections import Counter
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path
          mapping = {
              "PROCESSO":"processo", "LICITAÇÃO":"licitacao", "FORNECEDOR":"fornecedor",
              "SUB GRUPO":"sub_grupo", "ELEMENTO DE DESPESA":"elemento_despesa",
              "ELEMENTO":"elemento", "SUB GRUPO DE DESPESA":"sub_grupo_despesa",
              "VIGENCIA":"vigencia", "SITUAÇÃO DE PRIORIDADE":"situacao_prioridade",
              "SOLICITAÇÃO DA NE":"solicitacao_ne", "Nº DA NE":"numero_ne",
              "STATUS DO EMPENHO":"status_empenho", "FORNECEDORES":"fornecedores", "VALOR":"saldo"
          }
          rows = []
          blank = 0
          with open('/tmp/repasses.csv', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f, delimiter=';')
              for raw in reader:
                  if not any(str(v or '').strip() for v in raw.values()):
                      blank += 1
                      continue
                  status = next((str(v or '').strip() for h,v in raw.items() if (h or '').strip().upper() == 'STATUS DO EMPENHO'), '')
                  if status.upper() != 'AGUARDANDO ORÇAMENTO':
                      continue
                  row = {}
                  for original, key in mapping.items():
                      val = next((str(v or '').strip() for h,v in raw.items() if (h or '').strip().upper() == original), '')
                      row[key] = val
                  raw_value = row['saldo'].replace('R$', '').replace(' ', '').replace('.', '').replace(',', '.')
                  try:
                      row['saldo'] = float(Decimal(raw_value)) if raw_value else None
                  except Exception:
                      row['saldo'] = None
                  rows.append(row)

          total = round(sum(r['saldo'] or 0 for r in rows), 2)
          missing = sum(r['saldo'] is None for r in rows)

          # Auditoria de duplicidade: uma mesma linha completa não pode entrar duas vezes.
          row_keys = [tuple((str(v).strip() if v is not None else '') for v in r.values()) for r in rows]
          exact_duplicates = sum(c - 1 for c in Counter(row_keys).values() if c > 1)
          if exact_duplicates:
              raise SystemExit(f'Duplicidade exata detectada: {exact_duplicates} registro(s) repetido(s); publicação interrompida.')

          # Auditoria do documento: Nº DA NE deve identificar um único registro na seleção publicada.
          document_numbers = [str(r.get('numero_ne') or '').strip() for r in rows if str(r.get('numero_ne') or '').strip()]
          duplicate_documents = {doc: count for doc, count in Counter(document_numbers).items() if count > 1}
          if duplicate_documents:
              sample = ', '.join(f'{doc} ({count}x)' for doc, count in list(duplicate_documents.items())[:10])
              raise SystemExit(f'Documento duplicado detectado em Nº DA NE: {sample}; publicação interrompida.')

          missing_documents = sum(not str(r.get('numero_ne') or '').strip() for r in rows)

          # Validar a seleção antes de publicar: somente registros com Status do Empenho = AGUARDANDO ORÇAMENTO.
          if not 50 <= len(rows) <= 150:
              raise SystemExit(f'Quantidade inesperada de registros AGUARDANDO ORÇAMENTO ({len(rows)}); publicação interrompida.')
          if total < 1500000:
              raise SystemExit(f'Soma dos registros AGUARDANDO ORÇAMENTO inesperada ({total:.2f}); publicação interrompida.')
          if missing > 5:
              raise SystemExit(f'Quantidade inesperada de valores ausentes na seleção ({missing}); publicação interrompida.')

          print(f'AUDITORIA OK — registros: {len(rows)}; duplicidades exatas: {exact_duplicates}; documentos duplicados: {len(duplicate_documents)}; documentos sem Nº DA NE: {missing_documents}; valores sem saldo: {missing}; soma: {total:.2f}')
          data = {
              'rows': rows, 'total': total, 'missing_values': missing,
              'note': f'Fonte: planilha Aguardando Repasse Orçamentário, no Google Drive. Publicados exclusivamente os registros cujo Status do Empenho é AGUARDANDO ORÇAMENTO; {blank} linhas totalmente vazias da fonte foram ignoradas. {len(rows)} registros atendem ao filtro; soma dos valores preenchidos: R$ {total:,.2f}. {missing} registros sem valor não compõem a soma.'
          }
          Path('repasses.json').write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          # Incorporar a base também ao JSON principal, evitando dependência de um segundo fetch no navegador.
          main_path = Path('data.json')
          main = json.loads(main_path.read_text(encoding='utf-8'))
          main['generated_at'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          for dataset in main.get('datasets', []):
              if dataset.get('id') == 'repasses':
                  dataset['rows'] = rows
                  dataset['total'] = total
                  dataset['missing_values'] = missing
                  dataset['detail_count'] = len(rows)
                  dataset['note'] = data['note']
                  break
          else:
              raise SystemExit('Dataset repasses não encontrado em data.json')
          main_path.write_text(json.dumps(main, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(f"Registros AGUARDANDO ORÇAMENTO publicados: {len(rows)}; sem valor: {missing}; soma: {total:.2f}")
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos do painel
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4