name: Publicar Painel Financeiro e Orçamentário IOC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar base de repasses a partir do Google Drive
        run: |
          curl -fLsS "https://drive.google.com/uc?export=download&id=1ghcBkPmT-IkfWozLZVDdMvMe7eoD2J6k" -o /tmp/repasses.csv
          python - <<'PY'
          import csv, json, unicodedata
          from collections import Counter
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path

          def norm(value):
              value = unicodedata.normalize('NFKD', str(value or ''))
              value = ''.join(ch for ch in value if not unicodedata.combining(ch))
              return ''.join(ch for ch in value.upper() if ('A' <= ch <= 'Z') or ('0' <= ch <= '9'))
          mapping = {
              "PROCESSO":"processo", "LICITAÇÃO":"licitacao", "FORNECEDOR":"fornecedor",
              "SUB GRUPO":"sub_grupo", "ELEMENTO DE DESPESA":"elemento_despesa",
              "ELEMENTO":"elemento", "SUB GRUPO DE DESPESA":"sub_grupo_despesa",
              "VIGENCIA":"vigencia", "SITUAÇÃO DE PRIORIDADE":"situacao_prioridade",
              "SOLICITAÇÃO DA NE":"solicitacao_ne", "Nº DA NE":"numero_ne",
              "STATUS DO EMPENHO":"status_empenho", "FORNECEDORES":"fornecedores", "VALOR":"saldo"
          }
          rows = []
          source_row_keys = []
          blank = 0
          with open('/tmp/repasses.csv', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f, delimiter=';')
              for raw in reader:
                  if not any(str(v or '').strip() for v in raw.values()):
                      blank += 1
                      continue
                  headers = {norm(h): h for h in raw.keys() if h is not None}
                  status_header = headers.get(norm('STATUS DO EMPENHO'))
                  status = str(raw.get(status_header) or '').strip() if status_header else ''
                  if norm(status) != norm('AGUARDANDO ORÇAMENTO'):
                      continue
                  # Auditoria de duplicidade usa TODAS as colunas originais da fonte,
                  # não apenas os campos exibidos no painel.
                  source_row_keys.append(tuple((norm(h), str(raw.get(h) or '').strip()) for h in reader.fieldnames or []))
                  row = {}
                  for original, key in mapping.items():
                      actual_header = headers.get(norm(original))
                      val = str(raw.get(actual_header) or '').strip() if actual_header else ''
                      row[key] = val
                  raw_value = row['saldo'].replace('R$', '').replace(' ', '').replace('.', '').replace(',', '.')
                  try:
                      row['saldo'] = float(Decimal(raw_value)) if raw_value else None
                  except Exception:
                      row['saldo'] = None
                  rows.append(row)

          total = round(sum(r['saldo'] or 0 for r in rows), 2)
          missing = sum(r['saldo'] is None for r in rows)

          # Auditoria: linhas totalmente idênticas são aceitas quando os registros
          # representam valores/lançamentos distintos. Não bloquear a publicação.
          exact_duplicates = sum(c - 1 for c in Counter(source_row_keys).values() if c > 1)

          # Não tratar Nº DA NE isoladamente como chave única: a mesma numeração
          # pode existir em fontes/registros pagadores diferentes.
          document_numbers = [str(r.get('numero_ne') or '').strip() for r in rows if str(r.get('numero_ne') or '').strip()]
          duplicate_documents = {doc: count for doc, count in Counter(document_numbers).items() if count > 1}
          missing_documents = sum(not str(r.get('numero_ne') or '').strip() for r in rows)

          # Validar a seleção antes de publicar: somente registros com Status do Empenho = AGUARDANDO ORÇAMENTO.
          if not 50 <= len(rows) <= 150:
              raise SystemExit(f'Quantidade inesperada de registros AGUARDANDO ORÇAMENTO ({len(rows)}); publicação interrompida.')
          if total < 1500000:
              raise SystemExit(f'Soma dos registros AGUARDANDO ORÇAMENTO inesperada ({total:.2f}); publicação interrompida.')
          if missing > 5:
              raise SystemExit(f'Quantidade inesperada de valores ausentes na seleção ({missing}); publicação interrompida.')

          print(f'AUDITORIA OK — registros: {len(rows)}; duplicidades exatas: {exact_duplicates}; documentos repetidos: {len(duplicate_documents)}; documentos sem Nº DA NE: {missing_documents}; valores sem saldo: {missing}; soma: {total:.2f}')
          data = {
              'rows': rows, 'total': total, 'missing_values': missing,
              'note': f'Fonte: planilha Aguardando Repasse Orçamentário, no Google Drive. Publicados exclusivamente os registros cujo Status do Empenho é AGUARDANDO ORÇAMENTO; {blank} linhas totalmente vazias da fonte foram ignoradas. {len(rows)} registros atendem ao filtro; soma dos valores preenchidos: R$ {total:,.2f}. {missing} registros sem valor não compõem a soma.'
          }
          Path('repasses.json').write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          main_path = Path('data.json')
          main = json.loads(main_path.read_text(encoding='utf-8'))
          main['generated_at'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          for dataset in main.get('datasets', []):
              if dataset.get('id') == 'repasses':
                  dataset['rows'] = rows
                  dataset['total'] = total
                  dataset['missing_values'] = missing
                  dataset['detail_count'] = len(rows)
                  dataset['note'] = data['note']
                  break
          else:
              raise SystemExit('Dataset repasses não encontrado em data.json')
          main_path.write_text(json.dumps(main, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(f"Registros AGUARDANDO ORÇAMENTO publicados: {len(rows)}; sem valor: {missing}; soma: {total:.2f}")
          PY
      - name: Atualizar ordens bancárias emitidas a partir do Google Drive
        run: |
          curl -fLsS "https://drive.google.com/uc?export=download&id=1lRYujrJRv7ZPam-lYVB2CxCg_WEMbraC" -o /tmp/ordens.csv
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path

          def money(value):
              value = str(value or '').replace('R        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos do painel
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4, '').replace(' ', '').strip()
              if not value: return None
              value = value.replace('.', '').replace(',', '.')
              try: return float(Decimal(value))
              except Exception: return None

          with open('/tmp/ordens.csv', encoding='cp1252', newline='') as f:
              reader = csv.reader(f)
              for _ in range(4): next(reader, None)
              header = next(reader, None)
              if not header or len(header) < 12 or 'Ordem Bancária' not in header[2]:
                  raise SystemExit('Cabeçalho inesperado no relatório de ordens bancárias')
              rows, missing_values = [], 0
              for raw in reader:
                  if len(raw) < 12 or not any(str(v or '').strip() for v in raw): continue
                  ob = str(raw[2] or '').strip()
                  if not ob or ob == '-9': continue
                  valor = money(raw[10])
                  if valor is None: missing_values += 1
                  rows.append({'uge':str(raw[0] or '').strip(),'unidade':str(raw[1] or '').strip(),'ob':ob,'data':str(raw[3] or '').strip(),'cnpj':str(raw[4] or '').strip(),'favorecido':str(raw[5] or '').strip(),'processo':str(raw[6] or '').strip(),'fonte':str(raw[7] or '').strip(),'descricao_fonte':str(raw[8] or '').strip(),'observacao':str(raw[9] or '').strip(),'valor':valor,'movimentacao_liquida':money(raw[11])})
          if not 500 <= len(rows) <= 2000: raise SystemExit('Quantidade inesperada de ordens bancárias: ' + str(len(rows)))
          if missing_values > 5: raise SystemExit('Valores inválidos demais: ' + str(missing_values))
          total = round(sum(r['valor'] or 0 for r in rows), 2)
          path = Path('data.json'); main = json.loads(path.read_text(encoding='utf-8'))
          main['generated_at'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          for d in main.get('datasets', []):
              if d.get('id') == 'ordens_bancarias':
                  d['rows'], d['total'], d['detail_count'] = rows, total, len(rows)
                  d['note'] = 'Fonte: relatório ORDEM BANCARIAS EMITIDAS do Google Drive; registros importados sem deduplicar apenas pelo número da OB. ' + str(len(rows)) + ' registros; ' + str(missing_values) + ' valores ausentes/inválidos não compõem a soma. Total Doc - Valor: R$ ' + format(total, ',.2f')
                  break
          else: raise SystemExit('Dataset ordens_bancarias não encontrado em data.json')
          path.write_text(json.dumps(main, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('ORDENS BANCÁRIAS OK — registros: ' + str(len(rows)) + '; valores inválidos: ' + str(missing_values) + '; total: ' + str(total))
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos do painel
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4