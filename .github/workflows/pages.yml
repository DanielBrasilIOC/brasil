name: Atualização automática no dashboard

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "source_state.json"
      - "logs/atualizacoes_dashboard.csv"
  schedule:
    - cron: "0 3,7,11,15,19,23 * * 1-5"
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-saorc-hotfix"
  cancel-in-progress: false

jobs:
  build:
    outputs:
      data_changed: ${{ steps.sync.outputs.changed }}
      sync_ok: ${{ steps.sync.outputs.sync_ok }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descobrir automaticamente os seis CSVs oficiais no Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || '1Ae3_31uGRNvfvnN5euhiNHbk_mdkVg0L' }}
        run: |
          python -m pip install --disable-pip-version-check "google-auth[requests]>=2.30,<3"
          python .github/scripts/discover_drive_sources.py
      - name: Testar detecção de inclusão e exclusão
        run: |
          python .github/scripts/test_audit_sync.py
          python .github/scripts/test_drive_discovery.py
      - name: Sincronizar fontes e registrar auditoria
        id: sync
        if: github.event_name != 'pull_request'
        run: python .github/scripts/audit_sync.py
      - name: Guardar dados validados para conferência pós-publicação
        if: steps.sync.outputs.sync_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validated-dashboard-data
          path: |
            data.json
            repasses.json
            source_state.json
          if-no-files-found: error
      - name: Guardar log de auditoria desta execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-audit-log
          path: logs/atualizacoes_dashboard.csv
          if-no-files-found: error
      - name: Configurar GitHub Pages
        if: steps.sync.outputs.sync_ok == 'true'
        uses: actions/configure-pages@v5
      - name: Registrar horário da versão preparada para publicação
        if: steps.sync.outputs.sync_ok == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('dashboard-publication.json','w',encoding='utf-8') as f:
              json.dump({'published_at':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')},f)
          PY
      - name: Preparar arquivos estáticos do painel
        if: steps.sync.outputs.sync_ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.sync_ok == 'true' && (needs.build.outputs.data_changed == 'true' || github.event_name != 'schedule')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-publication:
    name: Conferir os dados efetivamente publicados
    if: >-
      needs.build.outputs.sync_ok == 'true' &&
      (needs.deploy.result == 'success' ||
       (needs.build.outputs.data_changed != 'true' && github.event_name == 'schedule'))
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar dados validados desta execução
        uses: actions/download-artifact@v4
        with:
          name: validated-dashboard-data
          path: .validated
      - name: Comparar a versão pública com a versão validada
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          root=Path('.validated')
          expected=json.loads((root/'data.json').read_text(encoding='utf-8'))
          expected_repasses=json.loads((root/'repasses.json').read_text(encoding='utf-8'))
          url='https://danielbrasilioc.github.io/brasil/data.json?verify='+os.environ['RUN_ID']+'-'+str(int(time.time()))
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'IOC-Dashboard-Publication-Check/1.0'})
          with urllib.request.urlopen(req,timeout=45) as response:
              if response.status != 200:
                  raise SystemExit(f'HTTP público inesperado: {response.status}')
              actual=json.loads(response.read().decode('utf-8-sig'))
          expected_sets={d.get('id'):d for d in expected.get('datasets',[])}
          actual_sets={d.get('id'):d for d in actual.get('datasets',[])}
          required=('financeiro','restos','empenhos','orcamentario','repasses','ordens_bancarias')
          failures=[]
          for name in required:
              e=expected_sets.get(name); a=actual_sets.get(name)
              if not e or not a:
                  failures.append(f'{name}: dataset ausente')
                  continue
              if e.get('rows') != a.get('rows'):
                  failures.append(f'{name}: registros públicos diferentes dos validados')
              if len(e.get('rows',[])) != len(a.get('rows',[])):
                  failures.append(f'{name}: quantidade pública divergente')
              if round(float(e.get('total',0)),2) != round(float(a.get('total',0)),2):
                  failures.append(f'{name}: total público divergente')
          if expected.get('generated_at') != actual.get('generated_at'):
              failures.append('generated_at público não corresponde à versão validada')
          rep_url='https://danielbrasilioc.github.io/brasil/repasses.json?verify='+os.environ['RUN_ID']+'-'+str(int(time.time()))
          req=urllib.request.Request(rep_url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'IOC-Dashboard-Publication-Check/1.0'})
          with urllib.request.urlopen(req,timeout=45) as response:
              actual_repasses=json.loads(response.read().decode('utf-8-sig'))
          if expected_repasses != actual_repasses:
              failures.append('repasses.json público difere da versão validada')
          # Além dos dados, confirma que a página principal e o documento visual do painel
          # são servidos publicamente e contêm o título esperado.
          for relative in ('index.html','dashboard-v2.html','dashboard-publication.json'):
              page_url='https://danielbrasilioc.github.io/brasil/'+relative+'?verify='+os.environ['RUN_ID']+'-'+str(int(time.time()))
              page_req=urllib.request.Request(page_url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'IOC-Dashboard-Publication-Check/1.0'})
              with urllib.request.urlopen(page_req,timeout=45) as page_response:
                  body=page_response.read().decode('utf-8-sig',errors='replace')
                  if page_response.status != 200:
                      failures.append(relative+': HTTP público diferente de 200')
                  if relative=='dashboard-v2.html' and 'Painel Financeiro' not in body:
                      failures.append('dashboard-v2.html público não contém o título esperado')
                  if relative=='dashboard-publication.json':
                      try:
                          info=json.loads(body)
                          if not info.get('published_at'):
                              failures.append('dashboard-publication.json sem published_at')
                      except Exception:
                          failures.append('dashboard-publication.json não contém JSON válido')
          if failures:
              raise SystemExit('PÓS-PUBLICAÇÃO FALHOU: '+'; '.join(failures))
          print(json.dumps({'status':'PUBLICACAO_VERIFICADA','url':url,'generated_at':actual.get('generated_at'),'datasets':{n:{'registros':len(actual_sets[n]['rows']),'total':actual_sets[n]['total']} for n in required}},ensure_ascii=False))
          PY

  persist-source-state:
    if: github.event_name != 'pull_request' && always() && needs.build.result == 'success'
    needs: [build, deploy, verify-publication]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Recuperar log de auditoria
        uses: actions/download-artifact@v4
        with:
          name: dashboard-audit-log
          path: .audit-artifact
      - name: Recuperar dados validados após publicação
        if: needs.build.outputs.data_changed == 'true' && needs.deploy.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: validated-dashboard-data
          path: .sync-artifact
      - name: Persistir auditoria e dados publicados
        env:
          DATA_CHANGED: ${{ needs.build.outputs.data_changed }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SYNC_OK: ${{ needs.build.outputs.sync_ok }}
          VERIFY_RESULT: ${{ needs.verify-publication.result }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p logs
          test -f .audit-artifact/atualizacoes_dashboard.csv
          install -D -m 0644 .audit-artifact/atualizacoes_dashboard.csv logs/atualizacoes_dashboard.csv
          if [ "$DATA_CHANGED" = "true" ] && [ "$DEPLOY_RESULT" = "success" ] && [ "$VERIFY_RESULT" = "success" ]; then
            test -f .sync-artifact/data.json
            test -f .sync-artifact/repasses.json
            test -f .sync-artifact/source_state.json
            install -D -m 0644 .sync-artifact/data.json data.json
            install -D -m 0644 .sync-artifact/repasses.json repasses.json
            install -D -m 0644 .sync-artifact/source_state.json source_state.json
            FINAL_STATUS="DADOS PUBLICADOS"
          elif [ "$SYNC_OK" != "true" ]; then
            FINAL_STATUS="FALHA NA SINCRONIZAÇÃO — ÚLTIMA VERSÃO PRESERVADA"
          elif [ "$DATA_CHANGED" = "true" ] && [ "$DEPLOY_RESULT" != "success" ]; then
            FINAL_STATUS="FALHA NA PUBLICAÇÃO — ÚLTIMA VERSÃO PRESERVADA"
          elif [ "$DATA_CHANGED" = "true" ] && [ "$VERIFY_RESULT" != "success" ]; then
            FINAL_STATUS="FALHA NA CONFERÊNCIA PÚBLICA — ÚLTIMA VERSÃO VÁLIDA PRESERVADA NO REPOSITÓRIO"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            FINAL_STATUS="VERIFICADO — SEM ALTERAÇÕES; PUBLICAÇÃO NÃO NECESSÁRIA"
          else
            FINAL_STATUS="PUBLICAÇÃO CONFERIDA — SEM ALTERAÇÃO DE DADOS"
          fi
          export FINAL_STATUS
          python - <<'PY'
          import csv, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('logs/atualizacoes_dashboard.csv')
          fields=['timestamp_utc','run_id','evento','resultado_execucao','fonte','fonte_id','conteudo_alterado','registros','total','registros_adicionados','registros_removidos','registros_alterados','valores_alterados','dashboard_atualizado','publicacao','mensagem']
          legacy=['timestamp_utc','run_id','evento','resultado_execucao','fonte','fonte_id','conteudo_alterado','registros','total','dashboard_atualizado','publicacao','mensagem']
          rows=[]
          if p.exists() and p.stat().st_size:
              with p.open('r',encoding='utf-8-sig',newline='') as f:
                  old=list(csv.reader(f,delimiter=';'))
              if old:
                  header=old[0]
                  for raw in old[1:]:
                      if len(raw)==len(fields):
                          item=dict(zip(fields,raw))
                      elif len(raw)==len(legacy):
                          item=dict(zip(legacy,raw))
                      else:
                          item=dict(zip(header,raw))
                      rows.append({key:item.get(key,'') for key in fields})
          # Corrige as linhas desta execução com o resultado real da publicação/conferência.
          final_ok=(os.environ.get('DATA_CHANGED')=='true' and os.environ.get('DEPLOY_RESULT')=='success' and os.environ.get('VERIFY_RESULT')=='success')
          for item in rows:
              if item.get('run_id')==os.environ['RUN_ID'] and item.get('fonte')!='RESUMO DA PUBLICAÇÃO':
                  item['dashboard_atualizado']='SIM' if final_ok else 'NÃO'
                  item['publicacao']=os.environ.get('FINAL_STATUS','')
          with p.open('w',encoding='utf-8-sig',newline='') as f:
              writer=csv.DictWriter(f,fieldnames=fields,delimiter=';')
              writer.writeheader()
              writer.writerows(rows)
              writer.writerow({
                  'timestamp_utc':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'),
                  'run_id':os.environ['RUN_ID'], 'evento':os.environ['EVENT_NAME'],
                  'resultado_execucao':'FINALIZAÇÃO', 'fonte':'RESUMO DA PUBLICAÇÃO', 'fonte_id':'',
                  'conteudo_alterado':'', 'registros':'', 'total':'',
                  'registros_adicionados':'', 'registros_removidos':'', 'registros_alterados':'', 'valores_alterados':'',
                  'dashboard_atualizado':'SIM' if os.environ.get('DATA_CHANGED')=='true' and os.environ.get('DEPLOY_RESULT')=='success' and os.environ.get('VERIFY_RESULT')=='success' else 'NÃO',
                  'publicacao':os.environ.get('FINAL_STATUS',''),
                  'mensagem':'Resultado final da publicação da execução.'
              })
          # Fail the job if any row no longer matches the canonical schema.
          with p.open('r',encoding='utf-8-sig',newline='') as f:
              check=list(csv.reader(f,delimiter=';'))
          assert check and check[0]==fields and all(len(row)==len(fields) for row in check[1:]), 'Histórico de auditoria com colunas inconsistentes'
          PY
          if [ -z "$(git status --porcelain -- data.json repasses.json source_state.json logs/atualizacoes_dashboard.csv)" ]; then
            echo "Nenhuma alteração para persistir."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json repasses.json source_state.json logs/atualizacoes_dashboard.csv
          git commit -m "Registrar auditoria da sincronização do painel [skip ci]"
          git push


  record-failed-run:
    name: Registrar falha do fluxo no log persistente
    if: ${{ github.event_name != 'pull_request' && always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.verify-publication.result == 'failure' || needs.persist-source-state.result == 'failure') }}
    needs: [build, deploy, verify-publication, persist-source-state]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Registrar falha mesmo quando a sincronização ou publicação falhar
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PERSIST_RESULT: ${{ needs.persist-source-state.result }}
          VERIFY_RESULT: ${{ needs.verify-publication.result }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p logs
          python - <<'PY'
          import csv, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('logs/atualizacoes_dashboard.csv')
          fields=['timestamp_utc','run_id','evento','resultado_execucao','fonte','fonte_id','conteudo_alterado','registros','total','registros_adicionados','registros_removidos','registros_alterados','valores_alterados','dashboard_atualizado','publicacao','mensagem']
          if p.exists() and p.stat().st_size:
              with p.open('r',encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.reader(f,delimiter=';'))
              if not rows or rows[0] != fields:
                  raise SystemExit('Cabeçalho do log inesperado; não vou sobrescrever o histórico.')
          else:
              with p.open('w',encoding='utf-8-sig',newline='') as f:
                  csv.writer(f,delimiter=';').writerow(fields)
          # Evita duplicar a mesma linha caso uma tentativa de push anterior tenha sido aceita.
          with p.open('r',encoding='utf-8-sig',newline='') as f:
              existing=list(csv.DictReader(f,delimiter=';'))
          run_id=os.environ['RUN_ID']
          if any(r.get('run_id')==run_id and r.get('fonte')=='REGISTRO DE FALHA DO WORKFLOW' for r in existing):
              print('Falha desta execução já está registrada.')
          else:
              detail=(f"build={os.environ['BUILD_RESULT']}; deploy={os.environ['DEPLOY_RESULT']}; "
                      f"conferência_pública={os.environ['VERIFY_RESULT']}; persistência={os.environ['PERSIST_RESULT']}; detalhes: {os.environ['JOB_URL']}")
              row={k:'' for k in fields}
              row.update({
                'timestamp_utc':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'),
                'run_id':run_id,'evento':os.environ['EVENT_NAME'],
                'resultado_execucao':'FALHA','fonte':'REGISTRO DE FALHA DO WORKFLOW',
                'conteudo_alterado':'NÃO','dashboard_atualizado':'NÃO',
                'publicacao':'FALHA REGISTRADA — verificar execução no GitHub Actions',
                'mensagem':detail
              })
              with p.open('a',encoding='utf-8-sig',newline='') as f:
                  csv.DictWriter(f,fieldnames=fields,delimiter=';').writerow(row)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add logs/atualizacoes_dashboard.csv
            if git diff --cached --quiet; then
              echo "Log de falha já persistido."
              exit 0
            fi
            git commit -m "Registrar falha do workflow no log [skip ci]" || true
            if git push origin HEAD:main; then
              echo "Falha registrada e persistida no log."
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            # Recria a linha de falha no log mais recente após sincronizar a branch.
            python - <<'PY'
            import csv, os
            from datetime import datetime, timezone
            from pathlib import Path
            p=Path('logs/atualizacoes_dashboard.csv')
            fields=['timestamp_utc','run_id','evento','resultado_execucao','fonte','fonte_id','conteudo_alterado','registros','total','registros_adicionados','registros_removidos','registros_alterados','valores_alterados','dashboard_atualizado','publicacao','mensagem']
            with p.open('r',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f,delimiter=';'))
            run_id=os.environ['RUN_ID']
            if not any(r.get('run_id')==run_id and r.get('fonte')=='REGISTRO DE FALHA DO WORKFLOW' for r in rows):
                row={k:'' for k in fields}
                row.update({'timestamp_utc':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'),'run_id':run_id,'evento':os.environ['EVENT_NAME'],'resultado_execucao':'FALHA','fonte':'REGISTRO DE FALHA DO WORKFLOW','conteudo_alterado':'NÃO','dashboard_atualizado':'NÃO','publicacao':'FALHA REGISTRADA — verificar execução no GitHub Actions','mensagem':f"build={os.environ['BUILD_RESULT']}; deploy={os.environ['DEPLOY_RESULT']}; persistência={os.environ['PERSIST_RESULT']}; detalhes: {os.environ['JOB_URL']}"})
                with p.open('a',encoding='utf-8-sig',newline='') as f: csv.DictWriter(f,fieldnames=fields,delimiter=';').writerow(row)
            PY
          done
          echo "Não foi possível persistir o registro de falha após 3 tentativas." >&2
          exit 1


  backup-last-valid:
    name: Guardar snapshot persistente da última versão válida
    if: ${{ github.event_name != 'pull_request' && needs.build.result == 'success' && needs.build.outputs.sync_ok == 'true' && needs.verify-publication.result == 'success' && needs.persist-source-state.result == 'success' && (needs.deploy.result == 'success' || github.event_name != 'schedule') }}
    needs: [build, deploy, verify-publication, persist-source-state]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar a versão mais recente da branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validar arquivos e preparar snapshot imutável
        id: prepare
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python .github/scripts/validate_backup.py .
          SNAPSHOT_ID="$(date -u +%Y%m%dT%H%M%SZ)-run-${RUN_ID}"
          SNAPSHOT_PATH="snapshots/${SNAPSHOT_ID}"
          export SNAPSHOT_ID SNAPSHOT_PATH
          mkdir -p "$RUNNER_TEMP/valid-snapshot"
          cp .github/scripts/validate_backup.py "$RUNNER_TEMP/validate_backup.py"
          for file in data.json repasses.json source_state.json dashboard-v2.html index.html; do
            cp "$file" "$RUNNER_TEMP/valid-snapshot/$file"
          done
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"valid-snapshot"
          files=("data.json","repasses.json","source_state.json","dashboard-v2.html","index.html")
          manifest={
            "snapshot_id":os.environ["SNAPSHOT_ID"],
            "created_at_utc":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
            "source_commit":os.environ["SOURCE_COMMIT"],
            "run_id":os.environ["RUN_ID"],
            "files":{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in files},
          }
          (root/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          echo "snapshot_path=${SNAPSHOT_PATH}" >> "$GITHUB_OUTPUT"
      - name: Gravar snapshot na branch independente dashboard-backups
        env:
          SNAPSHOT_PATH: ${{ steps.prepare.outputs.snapshot_path }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin dashboard-backups >/dev/null 2>&1; then
            git fetch origin dashboard-backups
            git checkout -B dashboard-backups origin/dashboard-backups
          else
            git checkout --orphan dashboard-backups
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$SNAPSHOT_PATH"
          cp "$RUNNER_TEMP/valid-snapshot/"* "$SNAPSHOT_PATH/"
          python "$RUNNER_TEMP/validate_backup.py" "$SNAPSHOT_PATH" --verify-manifest
          # Teste de restauração: copia o snapshot para um diretório isolado e valida de novo.
          RESTORE_TEST="$RUNNER_TEMP/restored-snapshot"
          mkdir -p "$RESTORE_TEST"
          cp "$SNAPSHOT_PATH/"* "$RESTORE_TEST/"
          python "$RUNNER_TEMP/validate_backup.py" "$RESTORE_TEST" --verify-manifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_PATH"
          git commit -m "Backup válido do dashboard: ${SNAPSHOT_PATH}"
          git push origin dashboard-backups
