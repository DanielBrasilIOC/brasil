name: Publicação visual do dashboard (sem alterar dados)

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "dashboard-v2.html"
      - ".github/workflows/pages-ui-hotfix.yml"
      - ".github/scripts/smoke_test_dashboard.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-ui-only-hotfix"
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Registrar execução responsável pela publicação
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          with open('dashboard-publication.json','w',encoding='utf-8') as f:
              json.dump({'run_id':int(os.environ['RUN_ID']),'run_attempt':int(os.environ['RUN_ATTEMPT'])},f)
          PY
      - name: Preparar arquivos estáticos sem modificar data.json
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
