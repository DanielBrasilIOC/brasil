name: Sync Diárias Pagas

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * 1-5'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: write

jobs:
  sync-diarias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localizar DIARIAS PAGAS.csv pelo nome na pasta oficial
        id: source
        env:
          GOOGLE_DRIVE_FOLDER_ID: 1Ae3_31uGRNvfvnN5EuhiNHbk_mdkVg0L
        run: python .github/scripts/discover_diarias_source.py

      - name: Baixar, validar e integrar Diárias Pagas
        env:
          DRIVE_FILE_ID: "${{ steps.source.outputs.file_id }}"
        run: python .github/scripts/sync_diarias_pagas.py

      - name: Persistir dados alterados
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração na base de Diárias Pagas.'
            exit 0
          fi
          git commit -m 'Atualiza Diárias Pagas a partir do Drive'
          git pull --rebase origin main
          git push origin HEAD:main
