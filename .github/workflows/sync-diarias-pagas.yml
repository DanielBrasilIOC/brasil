name: Sync Diárias Pagas

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * 1-5'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: write

jobs:
  sync-diarias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localizar DIARIAS PAGAS.csv pelo nome na pasta oficial
        id: source
        env:
          GOOGLE_DRIVE_FOLDER_ID: 1Ae3_31uGRNvfvnN5EuhiNHbk_mdkVg0L
        run: python .github/scripts/discover_diarias_source.py

      - name: Baixar e integrar Diárias Pagas
        env:
          DRIVE_FILE_ID: ${{ steps.source.outputs.file_id }}
        run: |
          python - <<'PY'
          import csv, json, re, urllib.request
          from datetime import datetime, timezone
          fid=__import__('os').environ['DRIVE_FILE_ID']; raw=None
          for url in [f'https://drive.usercontent.google.com/download?id={fid}&export=download&authuser=0&confirm=t',f'https://drive.google.com/uc?export=download&id={fid}']:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=60) as r: b=r.read()
                  if b.startswith((b'\xff\xfe',b'\xfe\xff')): text=b.decode('utf-16')
                  elif b.startswith(b'\xef\xbb\xbf'): text=b.decode('utf-8-sig')
                  else:
                      try: text=b.decode('utf-8')
                      except UnicodeDecodeError: text=b.decode('cp1252')
                  if not re.search(r'<(?:!doctype|html|head|body|script|meta)\\b',text[:2000],re.I): raw=text; break
              except Exception: pass
          if raw is None: raise SystemExit('Não foi possível baixar DIARIAS PAGAS.csv do Drive.')
          lines=raw.splitlines(); hi=next((i for i,line in enumerate(lines) if 'Favorecido Doc.' in line and 'OB - Valor Linha' in line),None)
          if hi is None: raise SystemExit('Cabeçalho de DIARIAS PAGAS não encontrado.')
          rows=[]
          for r in csv.reader(lines[hi+1:],delimiter=chr(9)):
              if len(r)<6 or not any(x.strip() for x in r): continue
              if r[0].strip().upper()=='TOTAL': continue
              try: valor=float(r[3].replace('R
              rows.append({'favorecido':r[0].strip(),'data_pagamento':r[1].strip(),'classificacao_orcamentaria':r[2].strip(),'valor':valor,'documento':r[4].strip(),'observacao':r[5].strip()})
          if not rows: raise SystemExit('DIARIAS PAGAS foi baixada, mas nenhum registro válido foi encontrado.')
          total=round(sum(x['valor'] for x in rows),2)
          dataset={'id':'diarias_pagas','title':'Diárias Pagas','short':'Diárias Pagas','source_name':'DIARIAS PAGAS.csv','source_url':f'https://drive.google.com/file/d/{fid}/view?usp=drivesdk','source_modified_at':datetime.now(timezone.utc).isoformat(),'total':total,'detail_count':len(rows),'rows':rows}
          with open('data.json',encoding='utf-8') as f: data=json.load(f)
          data['datasets']=[d for d in data.get('datasets',[]) if d.get('id')!='diarias_pagas']+[dataset]
          data['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          with open('data.json','w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          print(f'Diárias Pagas: {len(rows)} registros; total R$ {total:,.2f}'.replace(',','X').replace('.',',').replace('X','.'))
          PY

      - name: Publicar com proteção contra concorrência
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --cached --quiet; then echo 'Nenhuma alteração na base de Diárias Pagas.'; exit 0; fi
          git commit -m 'Atualiza Diárias Pagas a partir do Drive'
          git pull --rebase origin main
          git push origin HEAD:main
