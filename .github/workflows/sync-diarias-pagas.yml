name: Sync Diárias Pagas

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * 1-5'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: write

jobs:
  sync-diarias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar e integrar Diárias Pagas
        env:
          DRIVE_FILE_ID: 1pIo7jabcLwEjb6OauH847bb3Ifb-lVHV
        run: |
          python - <<'PY'
          import csv, json, re, urllib.request
          from datetime import datetime, timezone
          from decimal import Decimal

          fid = __import__('os').environ['DRIVE_FILE_ID']
          urls = [
              f'https://drive.usercontent.google.com/download?id={fid}&export=download&authuser=0&confirm=t',
              f'https://drive.google.com/uc?export=download&id={fid}'
          ]
          raw = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      b = r.read()
                  text = b.decode('utf-8-sig')
                  if not re.search(r'<(?:!doctype|html|head|body|script|meta)\\b', text[:2000], re.I):
                      raw = text
                      break
              except Exception:
                  try:
                      text = b.decode('cp1252', errors='replace')
                      if not re.search(r'<(?:!doctype|html|head|body|script|meta)\\b', text[:2000], re.I):
                          raw = text
                          break
                  except Exception:
                      pass
          if raw is None:
              raise SystemExit('Não foi possível baixar DIARIAS PAGAS.csv do Drive.')

          lines = raw.splitlines()
          while lines and not lines[0].strip(): lines.pop(0)
          if lines and 'DIARIAS PAGAS' in lines[0].upper(): lines.pop(0)
          reader = csv.DictReader(lines, delimiter=chr(9))
          rows=[]
          for r in reader:
              if not any(str(v or '').strip() for v in r.values()): continue
              s=str(r.get('OB - Valor Linha','')).replace('R$','').replace('.','').replace(',','.').strip()
              try: valor=float(Decimal(s))
              except Exception: continue
              rows.append({
                'favorecido':str(r.get('Favorecido Doc.','')).strip(),
                'data_pagamento':str(r.get('Transação - Dia','')).strip(),
                'classificacao_orcamentaria':str(r.get('OB - Classificação Orçamentária 1','')).strip(),
                'valor':valor,
                'documento':str(r.get('Documento','')).strip(),
                'observacao':str(r.get('DH - Observação','')).strip()
              })
          total=round(sum(x['valor'] for x in rows),2)
          dataset={
            'id':'diarias_pagas','title':'Diárias Pagas','short':'Diárias Pagas',
            'source_name':'DIARIAS PAGAS.csv',
            'source_url':f'https://drive.google.com/file/d/{fid}/view?usp=drivesdk',
            'source_modified_at':datetime.now(timezone.utc).isoformat(),
            'total':total,'detail_count':len(rows),'rows':rows
          }
          with open('data.json',encoding='utf-8') as f: data=json.load(f)
          data['datasets']=[d for d in data.get('datasets',[]) if d.get('id')!='diarias_pagas']+[dataset]
          data['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          with open('data.json','w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          print(f'Diárias Pagas: {len(rows)} registros; total R$ {total:,.2f}'.replace(',','X').replace('.',',').replace('X','.'))
          PY

      - name: Validar e publicar somente se houve mudança
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração na base de Diárias Pagas.'
          else
            git commit -m 'Atualiza Diárias Pagas a partir do Drive'
            git push
          fi
