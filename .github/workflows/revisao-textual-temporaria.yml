name: Revisao textual temporaria
on:
  push:
    paths:
      - '.github/workflows/revisao-textual-temporaria.yml'
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir textos sem alterar dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          reps = {
            'Base não publicada':'Base não disponível',
            'A base de Publicações Pagas não está disponível nesta publicação.':'A base de Publicações Pagas não está disponível.',
            'A base de Diárias Pagas ainda não está publicada no data.json.':'A base de Diárias Pagas ainda não está disponível no painel.',
            'Registros de diárias pagas, com 188 lançamentos identificados na base de origem.':'Registros de Diárias Pagas, com 188 registros identificados na base de origem.',
            'Número NE':'Número da Solicitação',
            'Pesquisar Número NE':'Pesquisar número da solicitação',
          }
          for a,b in reps.items():
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p = Path('dashboard-v2.html')
          s = p.read_text(encoding='utf-8')
          reps = {
            'Base não publicada':'Base não disponível',
            'A base de Publicações Pagas não está disponível nesta publicação.':'A base de Publicações Pagas não está disponível.',
            'A base de Diárias Pagas ainda não está publicada no data.json.':'A base de Diárias Pagas ainda não está disponível no painel.',
            'Registros de diárias pagas, com 188 lançamentos identificados na base de origem.':'Registros de Diárias Pagas, com 188 registros identificados na base de origem.',
            'Nenhum registro encontrado para os filtros informados.':'Nenhum registro foi encontrado para os filtros informados.',
          }
          for a,b in reps.items():
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dashboard-v2.html
          git diff --cached --quiet || git commit -m 'Revisar textos e padronizar português do dashboard'
          git push
      - name: Remover workflow temporario
        run: |
          rm -f .github/workflows/revisao-textual-temporaria.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/revisao-textual-temporaria.yml
          git diff --cached --quiet || git commit -m 'Remover workflow temporario de revisao textual'
          git push
