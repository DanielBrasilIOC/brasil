name: Testes do Assistente IOC
on:
  push:
    branches:
      - agente-teste
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar respostas e agregações
        run: node tests/agente-qa.test.js
