name: Auditoria de um milhão de perguntas — agente IOC (teste)

on:
  pull_request:
    branches:
      - agente-teste
    paths:
      - 'agente-teste/agent.js'
      - 'agente-teste/auditoria-milhao.js'
      - '.github/workflows/agente-teste-milhao.yml'
  push:
    branches:
      - agente-teste
    paths:
      - 'agente-teste/agent.js'
      - 'agente-teste/auditoria-milhao.js'
      - '.github/workflows/agente-teste-milhao.yml'

permissions:
  contents: write

concurrency:
  group: auditoria-agente-ioc-teste
  cancel-in-progress: false

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o branch de teste
        uses: actions/checkout@v4
        with:
          ref: agente-teste
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar um milhão de perguntas e validar as respostas
        run: node agente-teste/auditoria-milhao.js

      - name: Publicar o relatório e o arquivo completo de respostas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-1-milhao-perguntas
          path: |
            agente-teste/reports/auditoria-milhao.json
            agente-teste/reports/respostas-1-milhao.jsonl.gz
          if-no-files-found: warn
          retention-days: 90

      - name: Registrar o resumo no branch de teste
        if: always()
        run: |
          if [ -f agente-teste/reports/auditoria-milhao.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agente-teste/reports/auditoria-milhao.json
            git commit -m "Registra resultado da auditoria de um milhão de perguntas" || true
            git push origin HEAD:agente-teste
          fi

# Inicia a execução da bateria completa no branch isolado.
