name: Monitoramento técnico GOV.BR
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: monitoramento-govbr
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Verificar endereços públicos com tentativas repetidas
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          targets = [
            ("Portal GOV.BR", "https://www.gov.br/"),
            ("Acesso GOV.BR", "https://acesso.gov.br/"),
            ("Catálogo de Serviços GOV.BR", "https://www.gov.br/pt-br/servicos"),
          ]
          checks=[]
          for name,url in targets:
            attempts=[]
            for attempt in range(1,4):
              start=time.monotonic()
              status=None; ok=False; error=None
              try:
                req=urllib.request.Request(url, headers={"User-Agent":"IOC-GOVBR-Availability-Monitor/1.1"})
                with urllib.request.urlopen(req, timeout=15) as response:
                  status=response.status
                  ok=200 <= status < 400
              except urllib.error.HTTPError as e:
                status=e.code
                ok=200 <= status < 400
                error="HTTP error response"
              except Exception as e:
                error=type(e).__name__
              attempts.append({
                "attempt":attempt,"ok":ok,"http_status":status,
                "duration_ms":round((time.monotonic()-start)*1000),
                "checked_at":datetime.now(timezone.utc).isoformat(),"error":error
              })
              if attempt < 3:
                time.sleep(3)
            passed=sum(1 for a in attempts if a["ok"])
            state=("respondendo" if passed==3 else
                   "resposta_intermitente" if passed==2 else
                   "falha_no_ponto_de_medicao")
            checks.append({
              "name":name,"url":url,"ok":passed>=2,
              "state":state,"successful_attempts":passed,
              "attempts_total":len(attempts),"attempts":attempts,
              "http_status":next((a["http_status"] for a in reversed(attempts) if a["http_status"] is not None),None),
              "duration_ms":round(sum(a["duration_ms"] for a in attempts)/len(attempts)),
              "checked_at":attempts[-1]["checked_at"]
            })
          generated=datetime.now(timezone.utc).isoformat()
          try:
            with open("monitoramento-govbr.json",encoding="utf-8") as f:
              previous=json.load(f)
          except Exception:
            previous={}
          history=(previous.get("history") or [])[-95:]
          history.append({
            "generated_at":generated,
            "successful_attempts":sum(x["successful_attempts"] for x in checks),
            "attempts_total":sum(x["attempts_total"] for x in checks),
            "responding_targets":sum(1 for x in checks if x["state"]=="respondendo"),
            "intermittent_targets":sum(1 for x in checks if x["state"]=="resposta_intermitente"),
            "failed_targets":sum(1 for x in checks if x["state"]=="falha_no_ponto_de_medicao"),
            "checks":checks
          })
          payload={"generated_at":generated,"measurement_location":"GitHub Actions hosted runner; single measurement region",
                   "checks":checks,"history":history}
          with open("monitoramento-govbr.json","w",encoding="utf-8") as f:
            json.dump(payload,f,ensure_ascii=False,indent=2)
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
      - name: Consultar UptimeRobot (opcional; chave somente leitura)
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone
          api_key=os.environ.get("UPTIMEROBOT_API_KEY","")
          if not api_key:
            print("UPTIMEROBOT_API_KEY não configurada; integração externa aguardando ativação.")
            raise SystemExit(0)
          payload=urllib.parse.urlencode({"api_key":api_key,"format":"json","logs":"1","custom_uptime_ratios":"1-7-30"}).encode()
          req=urllib.request.Request("https://api.uptimerobot.com/v2/getMonitors",data=payload,headers={"Content-Type":"application/x-www-form-urlencoded","User-Agent":"IOC-GOVBR-Monitor/1.0"})
          with urllib.request.urlopen(req,timeout=20) as response:
            result=json.load(response)
          if result.get("stat")!="ok":
            raise RuntimeError("UptimeRobot API não retornou status OK")
          monitors=[]
          for m in result.get("monitors",[]):
            monitors.append({
              "id":m.get("id"),"friendly_name":m.get("friendly_name"),"url":m.get("url"),
              "status_code":m.get("status"),"status_label":{0:"pausado",1:"não_verificado",2:"respondendo",8:"parece_indisponível",9:"indisponível"}.get(m.get("status"),"desconhecido"),
              "uptime_ratio":m.get("custom_uptime_ratio"),"average_response_time":m.get("average_response_time")
            })
          with open("monitoramento-govbr.json",encoding="utf-8") as f:
            data=json.load(f)
          data["uptimerobot"]={"state":"connected","collected_at":datetime.now(timezone.utc).isoformat(),"source":"UptimeRobot API v2","monitors":monitors}
          with open("monitoramento-govbr.json","w",encoding="utf-8") as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
          print(json.dumps(data["uptimerobot"],ensure_ascii=False,indent=2))
          PY
      - name: Registrar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoramento-govbr.json
          git diff --cached --quiet || (git commit -m "Atualizar monitoramento técnico GOV.BR [skip ci]" && git push)
