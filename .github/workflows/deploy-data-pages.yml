name: Publicar dados do dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "data.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-saorc-hotfix"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Registrar horário da versão preparada para publicação
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('dashboard-publication.json','w',encoding='utf-8') as f:
              json.dump({'published_at':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')},f)
          PY
      - name: Preparar arquivos estáticos do painel
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
