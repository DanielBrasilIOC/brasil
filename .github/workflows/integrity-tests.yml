name: Testes da validação de integridade do dashboard
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/validacao-integridade-dashboard"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar testes da validação
        run: |
          python -m unittest discover -s .github/scripts -p 'test_integrity_validation.py' -v
