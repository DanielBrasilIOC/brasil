<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Financeiro e Orçamentário IOC</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f9}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dashboard" src="dashboard-v2.html?v=auditoria-pre-importacao-20261022-2240" title="Painel de Gestão"></iframe>
<script>
const frame=document.getElementById('dashboard');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    // Correção de apresentação: garante a grafia oficial do nome do painel.
    const oldTitle='Painel Financeiroe Orçamentário IOC';
    const newTitle='Painel Financeiro e Orçamentário IOC';
    if(doc.title===oldTitle) doc.title=newTitle;
    const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      if(node.nodeValue && node.nodeValue.includes(oldTitle)){
        node.nodeValue=node.nodeValue.replaceAll(oldTitle,newTitle);
      }
    });
    ['rap-thermometer.js?v=20261022f','rap-columns.js?v=20261022f'].forEach(src=>{
      const s=doc.createElement('script');
      s.src=src;
      doc.body.appendChild(s);
    });
  }catch(e){console.error('Não foi possível aplicar os ajustes do painel',e)}
});
</script>
</body>
</html>
